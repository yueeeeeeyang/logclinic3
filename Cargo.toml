[package]
# 包名固定为用户确认的 logclinic3，后续发布、日志目录和进程名都应以这里为准。
name = "logclinic3"
# 当前仍处于首版工程搭建阶段，版本号保留 Cargo 默认语义。
version = "0.1.0"
# 使用稳定 Rust 2024 edition；如后续目标工具链不支持，需要在跨平台验收时统一降级。
edition = "2024"

[dependencies]
# chardetng 用于日志正文的编码自动检测；检测失败时 UI 允许用户手动切换编码重新解码。
chardetng = "1.0.0"
# encoding_rs 显式提供 UTF-8、GBK、GB18030 和 Big5 解码能力，避免只依赖 GPUI 的传递依赖。
encoding_rs = "0.8.35"
# flate2 用于流式解码 tar.gz/tgz 的 gzip 层和单文件 .gz 日志，不负责把压缩包内容解压到磁盘。
flate2 = "1.1.9"
# GPUI 是当前桌面窗口和交互渲染框架，版本固定到 crates.io 已确认的 0.2.2。
gpui = "0.2.2"
# lucide-icons 提供工具栏和目录树图标字体，避免继续使用难看的手写符号。
lucide-icons = "1.14.0"
# crc32fast 用于 HPROF sidecar 缓存的首尾块快速校验，避免为了秒开重新计算全文件哈希。
crc32fast = "1.4.2"
# memmap2 用于 HPROF dump 快速只读映射；映射失败时会回退整文件读入内存，保证 Windows/macOS 行为可恢复。
memmap2 = "0.9.10"
# rustc-hash 只用于 HPROF 解析期间的进程内临时 ID 映射，降低数百万对象 HashMap 的 CPU 开销。
rustc-hash = "2.1.2"
# serde/serde_json 只用于 HPROF sidecar manifest，二进制索引文件继续使用手写紧凑格式。
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# reqwest 只用于设置页“测试模型”的 OpenAI 兼容接口探测；请求放入后台线程并使用 rustls，避免阻塞 UI 或依赖系统 OpenSSL。
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# sevenz-rust 只读取 7z 目录元数据，当前不调用任何实际解压到磁盘的接口。
sevenz-rust = { version = "0.6.1", default-features = false, features = ["bzip2", "zstd"] }
# tar 用于遍历 tar.gz/tgz 内部条目头部，配合 flate2 实现流式目录树构建。
tar = "0.4.45"
# tree-sitter 提供增量解析和查询能力；本项目只在小型 XML/properties 文件上启用整文件语法高亮。
tree-sitter = "0.26.8"
# tree-sitter-properties 提供 Java properties 文件语法和官方高亮查询，避免手写完整 properties 解析器。
tree-sitter-properties = "0.3.0"
# tree-sitter-xml 提供 XML 语法和官方高亮查询，供右侧只读查看器生成标签、属性和值的高亮范围。
tree-sitter-xml = "0.7.0"
# unrar 用于读取 RAR 文件列表；当前只使用 listing 模式，不执行解压写入。
unrar = "0.5.8"
# walkdir 用于递归扫描用户选择的目录，并显式关闭符号链接跟随。
walkdir = "2.5.0"
# zip 用于读取 ZIP 中央目录和条目元数据，不读取日志正文。
zip = "8.6.0"

[patch.crates-io]
# GPUI 0.2.2 的 Windows release shader 生成逻辑依赖构建脚本宿主也是 Windows；
# macOS 通过 cargo-xwin 交叉编译时不会生成 `shaders_bytes.rs`，因此本地补丁改为在 Windows 运行时从内嵌 HLSL 源码编译。
gpui = { path = "vendor/gpui-0.2.2" }
# unrar_sys 0.5.8 的 build.rs 使用宿主平台 cfg 判断目标平台，macOS 交叉编译 Windows MSVC 时会错误链接 pthread；
# 本地补丁改为读取 Cargo 注入的目标平台变量，避免污染日志查看器的 Windows x64 打包链路。
unrar_sys = { path = "vendor/unrar_sys-0.5.8" }
