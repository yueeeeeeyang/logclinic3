[package]
# 包名固定为用户确认的 logclinic3，后续发布、日志目录和进程名都应以这里为准。
name = "logclinic3"
# 当前仍处于首版工程搭建阶段，版本号保留 Cargo 默认语义。
version = "0.1.0"
# 使用稳定 Rust 2024 edition；如后续目标工具链不支持，需要在跨平台验收时统一降级。
edition = "2024"

[dependencies]
# chardetng 用于日志正文的编码自动检测；检测失败时 UI 允许用户手动切换编码重新解码。
chardetng = "1.0.0"
# encoding_rs 显式提供 UTF-8、GBK、GB18030 和 Big5 解码能力，避免只依赖 GPUI 的传递依赖。
encoding_rs = "0.8.35"
# flate2 用于流式解码 tar.gz/tgz 的 gzip 层，不负责把压缩包内容解压到磁盘。
flate2 = "1.1.9"
# GPUI 是当前桌面窗口和交互渲染框架，版本固定到 crates.io 已确认的 0.2.2。
gpui = "0.2.2"
# lucide-icons 提供工具栏和目录树图标字体，避免继续使用难看的手写符号。
lucide-icons = "1.14.0"
# sevenz-rust 只读取 7z 目录元数据，当前不调用任何实际解压到磁盘的接口。
sevenz-rust = { version = "0.6.1", default-features = false, features = ["bzip2", "zstd"] }
# tar 用于遍历 tar.gz/tgz 内部条目头部，配合 flate2 实现流式目录树构建。
tar = "0.4.45"
# unrar 用于读取 RAR 文件列表；当前只使用 listing 模式，不执行解压写入。
unrar = "0.5.8"
# walkdir 用于递归扫描用户选择的目录，并显式关闭符号链接跟随。
walkdir = "2.5.0"
# zip 用于读取 ZIP 中央目录和条目元数据，不读取日志正文。
zip = "8.6.0"
